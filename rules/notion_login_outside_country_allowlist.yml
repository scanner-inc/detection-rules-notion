# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: Notion Login From Outside Country Allowlist
description: |-
  ## Goal
  Detect user logins originating from countries outside an expected allowlist.

  ## Strategy
  Match user.login events whose geolocated country is not in the allowlist.
  This is a coarse heuristic, not behavioral anomaly detection - Notion does
  not emit a risk score or "suspicious location" verdict. Apply it to login
  events only; non-login events are routed through CDN/edge IPs and their
  geolocation is unreliable.

  ## Tuning
  - Edit the country allowlist below to match where your workforce operates.
  - The geolocation field path (event.country) is provisional pending
    confirmation against ingested JSONL. If the field is absent the rule fails
    open (alerts on all logins) rather than silently matching nothing - adjust
    the path once confirmed.
severity: Low
query_text: |-
  @scnr.source_type:notion
  event.type:user.login
  not event.country:("US")
  | groupbycount(event.actor.person.email)
  | where @q.count > 0
time_range_s: 300
run_frequency_s: 60
event_sink_keys:
- low_severity_alerts
tags:
- tactics.ta0001.initial_access
- techniques.t1078.valid_accounts
- source.notion
