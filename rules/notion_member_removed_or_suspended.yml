# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: Notion Member Removed or Suspended
description: |-
  Detect when a member is removed from the workspace or a user account is
  suspended. Individual removals are usually legitimate offboarding; monitor
  for removals performed by unexpected actors. See the Notion Bulk Member
  Removal rule for mass-removal detection.
severity: Low
query_text: |-
  @scnr.source_type:notion
  event.type:(workspace.permissions.member_removed user.suspended)
  | groupbycount(event.actor.person.email)
  | where @q.count > 0
time_range_s: 300
run_frequency_s: 60
event_sink_keys:
- low_severity_alerts
tags:
- tactics.ta0040.impact
- techniques.t1531.account_access_removal
- source.notion
