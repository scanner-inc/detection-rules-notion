# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: Notion Bulk Member Removal
description: |-
  Detect when more than 10 workspace members are removed within a 1-hour
  window. Bulk removal may indicate an attacker attempting to disrupt access,
  or legitimate bulk offboarding - investigate the actor and business
  justification.
severity: Low
query_text: |-
  @scnr.source_type:notion
  event.type:workspace.permissions.member_removed
  | count()
  | where @q.count > 10
time_range_s: 3600
run_frequency_s: 60
event_sink_keys:
- low_severity_alerts
tags:
- tactics.ta0040.impact
- techniques.t1531.account_access_removal
- source.notion
