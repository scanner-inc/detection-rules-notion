# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: Notion Personal Access Token Creation Policy Changed
description: |-
  Detect changes to the workspace or group policy governing who may create
  personal access tokens. Loosening this policy can enable persistent
  programmatic access to workspace data and should be reviewed.
severity: Medium
query_text: |-
  @scnr.source_type:notion
  event.type:(workspace.settings.personal_access_token_creation_policy_updated workspace.group.personal_access_token_creation_updated)
  | groupbycount(event.actor.person.email)
  | where @q.count > 0
time_range_s: 300
run_frequency_s: 60
event_sink_keys:
- medium_severity_alerts
tags:
- tactics.ta0003.persistence
- techniques.t1098.account_manipulation
- source.notion
