# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: Notion User Authentication Method Changed
description: |-
  Detect when a user removes a password or changes an MFA method (TOTP, SMS, or
  backup codes) on their account. Removing authentication factors can weaken
  account security and may indicate account takeover or an attacker
  establishing alternate access.

  Note (doc-only): derived from Notion's SIEM event catalog; not observed in
  available sample logs. The mfa_*_updated events fire on both enabling and
  disabling a factor - narrow to removal/disable once the payload field path is
  confirmed against ingested JSONL.
severity: Medium
query_text: |-
  @scnr.source_type:notion
  event.type:(user.settings.login_method.password_removed user.settings.login_method.mfa_totp_updated user.settings.login_method.mfa_sms_updated user.settings.login_method.mfa_backup_code_updated)
  | groupbycount(event.actor.person.email)
  | where @q.count > 0
time_range_s: 300
run_frequency_s: 60
event_sink_keys:
- medium_severity_alerts
tags:
- tactics.ta0005.defense_evasion
- techniques.t1556.modify_authentication_process
- source.notion
