# schema: https://scanner.dev/schema/scanner-detection-rule.v1.json
name: Notion Member Role Updated
description: |-
  Detect when a workspace member's role is changed. Role changes are relatively
  rare and should be reviewed to confirm the actor is authorized and the change
  is expected. Pay particular attention to promotions to Membership admin or
  Workspace owner, which represent privilege escalation.
severity: Medium
query_text: |-
  @scnr.source_type:notion
  event.type:workspace.permissions.member_role_updated
  | groupbycount(event.actor.person.email)
  | where @q.count > 0
time_range_s: 300
run_frequency_s: 60
event_sink_keys:
- medium_severity_alerts
tags:
- tactics.ta0003.persistence
- techniques.t1098.account_manipulation
- source.notion
